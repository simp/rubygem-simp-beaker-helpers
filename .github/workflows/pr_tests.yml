# Run Puppet checks and test matrix on Pull Requests
# ------------------------------------------------------------------------------
# The testing matrix considers ruby/puppet versions supported by SIMP and PE:
# ------------------------------------------------------------------------------
# Release       Puppet   Ruby    EOL
# PE 2019.8     6.22     2.7     2022-12 (LTS)
# PE 2021.Y     7.x      2.7     Quarterly updates
#
# https://puppet.com/docs/pe/2018.1/component_versions_in_recent_pe_releases.html
# https://puppet.com/misc/puppet-enterprise-lifecycle
# https://puppet.com/docs/pe/2018.1/overview/getting_support_for_pe.html
# ==============================================================================
#
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
#
---
name: PR Tests
'on':
  push:
    branches:
      # A test branch for seeing if your tests will pass in your personal fork
      - test_me_github
  pull_request:
    types: [opened, reopened, synchronize]

env:
  PUPPET_VERSION: '~> 8'

jobs:
  ruby-style:
    name: 'Ruby Style'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: "Install Ruby 3.2"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - run: |
          bundle show
          bundle exec rubocop

  spec-tests:
    name: 'Spec'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        puppet:
          - label: 'OpenVox 8.x'
            puppet_version: '~> 8.0'
            ruby_version: '3.2'
            experimental: false
          - label: 'OpenVox 9.x (Ruby 4.0)'
            puppet_version: '~> 9.0'
            ruby_version: '4.0'
            experimental: false
    env:
      PUPPET_VERSION: ${{matrix.puppet.puppet_version}}
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby ${{matrix.puppet.ruby_version}}'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.puppet.ruby_version}}
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - run: 'bundle exec rake spec'
        continue-on-error: ${{matrix.puppet.experimental}}

  acceptance:
    name: '${{matrix.beaker.suite}}, ${{matrix.puppet.label}}'
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        puppet:
          - label: 'OpenVox 8.x'
            puppet_version: '~> 8.0'
            ruby_version: '3.2'
            collection: 'openvox8'
            experimental: false
        beaker:
          - label: beaker
            suite: default
            allowed_to_fail: false
          - label: beaker puppet_collections
            suite: puppet_collections
            allowed_to_fail: false
      fail-fast: false
    env:
      PUPPET_VERSION: ${{matrix.puppet.puppet_version}}
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.puppet.ruby_version }}
      - name: ensure entropy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rng-tools
          sudo systemctl start rng-tools
      - name: install docker
        run: |
          set -x
          sudo apt-get remove -y podman ||:
          sudo apt-get install -y docker-ce docker docker-engine docker.io containerd runc ||:
          sudo apt-get update
          sudo apt autoremove -y
          sudo systemctl start docker
      - name: install bundle
        run: |
          bundle config path vendor
          bundle install -j $(nproc)
      - name: set BEAKER_PUPPET_COLLECTION
        if: ${{matrix.puppet.collection}}
        run: echo "BEAKER_PUPPET_COLLECTION=${{matrix.puppet.collection}}" >> $GITHUB_ENV
      - name: 'run beaker:suite "${{matrix.beaker.label}}"'
        continue-on-error: ${{matrix.puppet.experimental || matrix.beaker.allowed_to_fail}}
        env:
          BEAKER_SUITE: ${{matrix.beaker.suite}}
        run: bundle exec rake beaker:suites[$BEAKER_SUITE,docker]

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded. Add any new job in this workflow to `needs:`.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - ruby-style
      - spec-tests
      - acceptance
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null

